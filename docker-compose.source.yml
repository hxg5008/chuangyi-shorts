# Build this exact custom source. No upstream image replacement or auto-updater.
services:
  app:
    image: huobao-drama-custom:source-20261105
    build:
      context: .
      args:
        HUOBAO_VERSION: custom-source-20261105
    ports:
      - "127.0.0.1:5679:5679"
    environment:
      MYSQL_AUTO_IMPORT: "false"
    volumes:
      - huobao-source-data:/app/data
    restart: unless-stopped

volumes:
  huobao-source-data:
